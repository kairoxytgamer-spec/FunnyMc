<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FunnyMC Lifesteal</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #07110f;
      color: white;
      text-align: center;
    }

    nav {
      padding: 20px;
      background: #050908;
      font-size: 25px;
      font-weight: bold;
    }

    nav span {
      color: #20e69a;
    }

    .hero {
      padding: 80px 20px;
    }

    .tag {
      color: #20e69a;
      font-size: 18px;
    }

    h1 {
      font-size: 48px;
      margin: 20px 0;
    }

    p {
      color: #aeb8b6;
      font-size: 18px;
    }

    .button {
      display: inline-block;
      margin: 12px;
      padding: 16px 30px;
      border-radius: 12px;
      background: #13c98a;
      color: #00150e;
      text-decoration: none;
      font-weight: bold;
    }

    .dark {
      background: #13201d;
      color: white;
    }

    .section {
      padding: 40px 20px;
    }

    .card {
      max-width: 500px;
      margin: 15px auto;
      padding: 25px;
      background: #101d1a;
      border-radius: 15px;
    }
  </style>
</head>

<body>

  <nav>
    🩸 <span>FunnyMC</span> Lifesteal
  </nav>

  <div class="hero">
    <div class="tag">⚡ Powerful Minecraft Lifesteal</div>

    <h1>Welcome to<br>FunnyMC</h1>

    <p>Join our public Lifesteal Minecraft server.</p>

    <a class="button" href="#">🎮 Play Now</a>
    <a class="button dark" href="#">💬 Discord</a>
  </div>

  <div class="section">
    <h2>🔥 Server Features</h2>

    <div class="card">
      ❤️ Lifesteal SMP<br><br>
      ⚔️ PvP & Events<br><br>
      🌎 Public Community
    </div>
  </div>

</body>
</html>
